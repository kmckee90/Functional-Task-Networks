[project]
name = "globo_explorer_gpu"
version = "0.1.0"
description = "Single-lifetime conv-reservoir RECODE explorer on the warpcraft GPU globo env, in JAX/Flax (a GPU port of ../globo_explorer)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The GPU-batched globo engine (Warp/torch on CUDA), driven at num_worlds=1
    # for a single continuous lifetime. Pulls torch/warp-lang/jax/flax/optax.
    "warpcraft @ git+https://github.com/Astera-org/warpcraft.git",
    # CUDA JAX for the reservoir + branching-DQN + RECODE, all GPU-resident.
    "jax[cuda12]",
    "flax",
    "optax",
    "numpy",
    "pillow",
    "imageio",
    "pyyaml",
    "websockets",
]

[tool.uv]
# warpcraft (as a dependency) doesn't propagate its own [tool.uv] index config,
# so replicate its cu128 torch pin here to keep a matched CUDA 12.8 build.
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
