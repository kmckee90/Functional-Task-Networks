run:
  name: gru_smoke
  seed: 7
  output_dir: runs

model:
  name_or_path: sshleifer/tiny-gpt2
  dtype: float32
  device: auto
  attn_implementation: eager
  trust_remote_code: false

data:
  processed_dir: data/processed/gru_smoke
  datasets:
    - type: niah
      name: niah_smoke
      enabled: true
      train_size: 24
      eval_size: 8
      context_lengths: [96, 160]
      needle_depths: [0.1, 0.5, 0.9]
      num_needles: 1

train:
  epochs: 2
  batch_size: 4
  grad_accum: 1
  lr: 0.001
  max_length: 256
  overflow: truncate_left
  num_workers: 0
  log_every: 5
  save_every: 0

eval:
  batch_size: 4
  max_length: 256
  overflow: truncate_left
  compute_accuracy: true

gru:
  embedding_dim: 64
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0
  tie_weights: false

ftn_lora:
  H: 16
  k: 4
  rank: 2
  alpha: 8.0
  dropout: 0.0
  init_b_zero: false
  reconfig_steps: 1
  train_reconfig_steps: 1
  reconfig_lr: 0.5
  lateral_steps: 0
  lateral_kernel: 3
  lateral_polyak: 0.0
  grid_dim: 4

