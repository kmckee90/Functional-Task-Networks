run:
  name: qwen25_7b_locomo_memory_pod
  seed: 29
  artifact_root: /home/dev/artifacts/long_context
  output_dir: runs

model:
  name_or_path: Qwen/Qwen2.5-7B
  dtype: bfloat16
  device: cuda
  device_map: null
  attn_implementation: sdpa
  trust_remote_code: false
  gradient_checkpointing: true

memory:
  processed_dir: data/processed/qwen25_7b_locomo_memory_pod
  datasets:
    - type: locomo
      name: locomo10
      enabled: true
      path: /home/dev/datasets/locomo/data/locomo10.json
      block_mode: session
      train_split: train
      eval_split: train
      train_episodes: 10
      eval_episodes: 10
      questions_per_episode: 25
  write:
    split: eval
    max_length: 2048
    stride: 2048
    steps_per_block: 5
    batch_size: 1
    lr: 0.0002
    reconfig_steps: 1
    log_every: 10
  eval:
    split: eval
    modes: [zero, oracle, query, wrong, full_context]
    max_length: 8192
    overflow: truncate_left
    query_reconfig_steps: 1

ftn_lora:
  H: 256
  k: 32
  rank: 2
  alpha: 16.0
  dropout: 0.05
  init_b_zero: false
  target_modules: [q_proj, o_proj, up_proj, gate_proj, down_proj]
  reconfig_steps: 1
  train_reconfig_steps: 1
  reconfig_lr: 1.0
  lateral_steps: 1
  lateral_kernel: 7
  lateral_polyak: 0.0
  grid_dim: 16
