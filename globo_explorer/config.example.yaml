# =============================================================================
# globo_explorer config
#   Run:        uv run python train.py --config config.example.yaml
#   Override:   uv run python train.py --config config.example.yaml --device cpu
#   Precedence: CLI flag > this file > built-in default
#   Keys are the CLI option names (dashes or underscores both work).
# =============================================================================
#
# GLOSSARY
# -----------------------------------------------------------------------------
# Episode control
#   episodes          Number of episodes; 0 = run indefinitely (until killed).
#   max_steps         Per-episode step cap; 0 = no limit (episode ends only on death).
#
# Reproducible world
#   seed              Fixes terrain (map generation).
#   spawn             "x,y,z" static_spawnpoint -> identical start location every restart
#                     (also fixes initial facing). null = engine picks (varies).
#   freeze_daylight   Stop the day/night cycle (stay at midday) so observations
#                     never go dark on long runs.
#   weather_seed      Reseed globo's weather RNG for reproducible/selectable weather
#                     & clouds (a given value -> same weather every life). null =
#                     wall-clock random (different weather each life).
#   invincible        true  = HP/stats pinned, player never dies (one endless life);
#                     false = player can die and restart to the identical world.
#
# Control
#   action_mode       "discrete" = one action/step (single DQN over 10 actions);
#                     "factored" = concurrent branching DQN over 5 mutually-exclusive
#                     groups [look_h, look_v, jump, move, strafe] -> the agent can
#                     move + strafe + jump + look all at once.
#
# Observation
#   obs_width         First-person view width in pixels.
#   obs_height        First-person view height in pixels.
#   init_frames       Frames to let the engine load before the first observation.
#
# RECODE (intrinsic exploration reward, computed over the downscaled image itself)
#   recode_down_h     Downscaled embedding height (lower => less memory).
#   recode_down_w     Downscaled embedding width.
#   recode_rgb        true = cluster over RGB; false = grayscale (cheaper).
#   recode_memory     Number of RECODE cluster atoms (memory size).
#
# RL / DQN
#   gamma             Discount factor.
#   lr                Learning rate (Adam).
#   batch             Minibatch size.
#   replay_capacity   Replay buffer capacity (transitions).
#   warmup            Min stored transitions before training starts.
#   epsilon_decay     Steps to anneal epsilon from start (~1.0) to 0.05.
#   exploration_coef  Weight on the RECODE intrinsic reward.
#   env_reward_coef   Weight on globo's in-game reward (0 = pure exploration).
#
# Training cadence
#   train_interval    J: collect J steps between training rounds.
#   train_iters       K: gradient updates per training round.
#
# In-episode GIF peeks (game-time ~3-7 ms/step, so ~10s ~= 2700-3700 steps)
#   render_window     Steps each GIF spans.
#   render_interval   Steps between GIF captures.
#   render_max_frames Frame cap per GIF (the window is stride-subsampled to this).
#   gif_seconds       Fixed GIF playback length; 0 = real game-time from engine dtime.
#
# Misc
#   device            "cuda" or "cpu".
# =============================================================================

# PARAMETERS

# Episode control
episodes: 0
max_steps: 0

# Reproducible world
seed: 0
spawn: "8,8,115"
freeze_daylight: true
weather_seed: 0
invincible: false

# Control
action_mode: discrete   # or: factored

# Observation
obs_width: 64
obs_height: 32
init_frames: 200

# RECODE (intrinsic exploration reward, computed over the downscaled image itself)
recode_down_h: 16
recode_down_w: 32
recode_rgb: false
recode_memory: 5000

# RL / DQN
gamma: 0.90
lr: 0.0003
batch: 256
replay_capacity: 50000
warmup: 500
epsilon_decay: 30000
exploration_coef: 1.0
env_reward_coef: 0.0

# Training cadence
train_interval: 50
train_iters: 50

# In-episode GIF peeks (game-time ~3-7 ms/step, so ~10s ~= 2700-3700 steps)
render_window: 3700
render_interval: 8000
render_max_frames: 250
gif_seconds: 0.0

# Misc
device: cuda
