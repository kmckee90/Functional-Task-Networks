[project]
name = "globo_explorer"
version = "0.1.0"
description = "Conv2d-reservoir RECODE explorer (Fluid_1S-style) trained on the globo Minetest environment via craftium."
requires-python = "==3.11.*"
dependencies = [
    # craftium provides the Luanti/Minetest gym engine (bundles Luanti 5.12.0).
    # Not on PyPI; install the prebuilt cp311 manylinux wheel from the GitHub release.
    # This direct URL works for CPython 3.11 / x86_64 only.
    "craftium @ https://github.com/mikelma/craftium/releases/download/v0.0.1/craftium-0.0.1-cp311-cp311-manylinux_2_28_x86_64.whl",
    "torch>=2.4",
    "numpy",
    "imageio",
    # gymnasium is pinned transitively by craftium to ==0.29.1 (do NOT add a
    # conflicting constraint here -- this is why globo_explorer is an isolated
    # uv project, separate from the repo root which uses gymnasium>=1.0.0).
]

[tool.uv]
# craftium is a 328MB prebuilt wheel; copy-link to avoid cross-fs hardlink warnings.
link-mode = "copy"
