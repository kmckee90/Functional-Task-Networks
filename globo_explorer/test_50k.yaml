# Finite 50k-step test of the offline-reward + goal + prioritized-replay system.
# Overlays default.yaml.
#   uv run python train.py --config test_50k.yaml
total_steps: 50000
episodes: 0
max_steps: 1000          # truncate episodes -> regular trajectory boundaries
invincible: false        # deaths give true terminals; truncations give boundaries
action_mode: discrete

# coarser + cheaper RECODE for a tractable test (also fewer centroids to dump)
recode_memory: 1024
offline_scan_max: 4096

# cadence tuned so the per-round offline scan cost stays modest over 50k steps
train_interval: 250
train_iters: 20

render_window: 2700
render_interval: 10000
device: cuda
