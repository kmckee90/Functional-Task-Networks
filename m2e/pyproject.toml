[project]
name = "m2e"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# CUDA PyTorch is supplied by the pod image and exposed by setup_recode.sh.
# Keep uv from replacing that image-specific CUDA build.
dependencies = [
    "numpy==2.5.2",
    "matplotlib==3.11.2",
    "mlflow==3.17.2",
    "tqdm==4.70.1",
    "Pillow==13.0.0",
    "gymnasium==1.4.0",
    "pygame==2.6.1",
]

[tool.uv]
package = false
