[project]
name = "ftn-chat"
version = "0.3.0"
description = "FTN-Chat: continual-learning LLM chatbot (FTN-LoRA bank on a frozen Qwen backbone) with a live mask-visualization chat applet"
requires-python = "==3.12.*"
dependencies = [
    # Qwen3.6 (hybrid Gated DeltaNet) needs transformers 5.x, which imports
    # torch.distributed.tensor.DTensor and therefore needs torch >= 2.6.
    # Default PyPI torch wheels bundle CUDA 12.x — no custom index needed
    # (the old cu124 index pin + its shared-uv-cache cudnn-poisoning issue
    # are gone with it; if conv2d ever dies with CUDNN_STATUS_NOT_INITIALIZED
    # see git history of this file for the uv cache clean recipe).
    "torch>=2.8",
    "transformers>=5.14",
    "accelerate>=1.0.0",   # device_map sharding
    "gradio>=5.0.0",       # chat applet
    "datasets>=3.0.0",     # optional general-instruction rehearsal
    "numpy",
    "pillow",
    # Fast path for Qwen3.6's Gated DeltaNet: flash-linear-attention supplies
    # the chunked linear-attention triton kernels transformers falls back away
    # from (the "fast path is not available" warning). Pure triton/Python — no
    # nvcc needed (the pod has a C compiler for triton JIT but no CUDA toolkit
    # matching the cu13 torch build, so the compiled causal-conv1d / flash-attn
    # kernels are deliberately NOT used; fla is the kernel that matters here).
    "flash-linear-attention>=0.1.0",
    "einops",
    # fla's gated-DeltaNet backward uses triton kernels that produce INCORRECT
    # results on Hopper (H100) with triton>=3.4 (fla issue #640); fla routes
    # that backward through tilelang instead when it's installed. Required — we
    # backprop through the DeltaNet layers both for the mask reconfiguration
    # gradient and for training.
    "tilelang",
]

[tool.ruff]
lint.ignore = ["F401"]

[tool.ruff.format]
docstring-code-line-length = 120
