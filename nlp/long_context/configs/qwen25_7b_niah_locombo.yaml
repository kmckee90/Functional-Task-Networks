run:
  name: qwen25_7b_niah_locombo
  seed: 13
  artifact_root: /home/dev/artifacts/long_context
  output_dir: runs

model:
  name_or_path: Qwen/Qwen2.5-7B
  dtype: bfloat16
  device: cuda
  device_map: null
  attn_implementation: sdpa
  trust_remote_code: false
  gradient_checkpointing: true

data:
  processed_dir: data/processed/qwen25_7b_niah_locombo
  datasets:
    - type: niah
      name: niah
      enabled: true
      train_size: 256
      eval_size: 128
      context_lengths: [1024] #, 4096, 8192, 16384, 32768]
      needle_depths: [0.05, 0.25, 0.5, 0.75, 0.95]
      num_needles: 1
    - type: locomo
      name: locomo
      enabled: false
      # Set one of these before enabling:
      # path: /path/to/locomo.jsonl
      # dataset_name: your-hf-org/your-locomo-dataset
      # subset: null
      train_split: train
      eval_split: validation
      train_size: 256
      eval_size: 128

train:
  epochs: 1
  batch_size: 1
  grad_accum: 8
  lr: 0.0002
  max_length: 8192
  overflow: skip
  num_workers: 0
  log_every: 10
  save_every: 100
  max_steps: null

eval:
  batch_size: 1
  max_length: 32768
  overflow: skip
  compute_accuracy: false

gru:
  embedding_dim: 512
  hidden_dim: 1024
  num_layers: 2
  dropout: 0.1
  tie_weights: false

ftn_lora:
  H: 1024
  k: 256
  rank: 1
  alpha: 16.0
  dropout: 0.05
  init_b_zero: false
  target_modules: [q_proj, o_proj, up_proj, gate_proj, down_proj]
  reconfig_steps: 1
  train_reconfig_steps: 1
  reconfig_lr: 1.0
  lateral_steps: 1
  lateral_kernel: 7
  lateral_polyak: 0.0
  grid_dim: 32
